name: CI

on:
    pull_request:
        push:
            branches:
                - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

jobs:
    integration:
        name: Integraton tests
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        defaults:
            run: 
                shell: bash
        
        env:
            COMPOSE_FILE: compose.yaml
            COMPOSE_PROFILE: test
            COMPOSE_PROJECT_NAME: ci-${{github.run_id}}-${{github.run_attempt}}
            TEST_CONTAINER: tests-${{github.run_id}}-${{github.run_attempt}}

            POSTGRES_USER: ${{secrets.CI_POSTGRES_USER}}
            POSTGRES_PASSWORD: ${{secrets.CI_POSTGRES_PASSWORD}}
            POSTGRES_DB: ${{secrets.CI_POSTGRES_DB}}
            API_PORT: "8001"
        
        steps:
            - name: Checkout source
              uses: actions/checkout@v5
              with:
                persist-credentials: false
            
            - name: Prepare report directory
              run: mkdir -p reports

            - name: Validate Compose configuration
              run: |
                docker compose version
                docker compose --env-file /dev/null config --quiet
            
            - name: Build API and test images
              run: |
                docker compose --env-file /dev/null build api tests
            
            - name: Start API and database
              run: |
                docker compose --env-file /dev/null up \
                  -d \
                  --no-build \
                  --wait \
                  --wait-timeout 90\
                  api db
            
            - name: Run integration tests
              run: |
                docker compose --env-file /dev/null run \
                  -T \
                  --no-deps \
                  --name "$TEST_CONTAINER" \
                  tests \
                  python -m pytest tests/ \
                    -v \
                    -p no:cacheprovider \
                    --junitxml=/tmp/results.xml

            - name: Verify backup and restoration
              run: |
                docker compose --env-file /dev/null stop api

                python3 scripts/verify_recovery.py \
                    --env-file /dev/null \
                    --project "$COMPOSE_PROJECT_NAME"
                
                docker compose --env-file /dev/null start api

                python3 - <<'PY'
                import http.client
                import os 
                import time 
                import urllib.error
                import urllib.request

                url = f"http://127.0.0.1:{os.environ['API_PORT']}/ready"
                deadline = time.monotonic() + 30
                last_error = "No response received"

                while time.monotonic() < deadline:
                    try:
                        with urllib.request.urlopen(url, timeout=2) as response:
                            if response.status == 200:
                                print("API is ready after restart")
                                break
                            
                            last_error = f"HTTP {response.status}"

                    except (
                      urllib.error.URLError, 
                      OSError, 
                      http.client.HTTPException
                      ) as exec:
                        last_error = f"{type(exc).__name__}: {exc}"
                    
                    time.sleep(1)
                
                else:
                    raise SystemExit(
                        f"API did not become ready: {last_error}"
                    )
                
                PY
            
            - name: Verify database outage behavior
              run: |
                docker compose --env-file /dev/null stop db

                python3 - <<'PY'
                import os
                import time
                import urllib.error
                import urllib.request

                base_url = f"http://127.0.0.1:{os.environ['API_PORT']}"

                def get_status(path, timeout):
                    try:
                        with urllib.request.urlopen(
                            base_url + path,
                            timeout=timeout,
                            ) as response:
                                return response.status
                    except urllib.error.HTTPError as exc:
                        return exc.code
                
                health_status =  get_status("/health", timeout=3)
                assert health_status == 200, (
                    f"/health returned {health_status}; expected 200"
                )
                
                started = time.monotonic()
                ready_status = get_status("/ready", timeout=7)
                elapsed = time.monotonic() - started

                assert ready_status == 503, (
                    f"/ready returned {ready_status}; expected 503"
                )
                assert elapsed < 7, (
                    f"/ready took {elapsed:.2f}s; expected under 7s"
                )
                
                print(
                    f"Outage check passed: health=200"
                    f"ready=503, response time={elapsed:.2f}s"
                )
                PY
            
            - name: Collect test report and container logs
              if: always()
              run: |
                mkdir -p reports

                if docker container inspect "$TEST_CONTAINER" > /dev/null 2>&1; then
                  docker cp \
                    "$TEST_CONTAINER:/tmp/results.xml" \
                    reports/results.xml || true
                fi

                docker compose --env-file /dev/null logs \
                  --no-color --timestamps
                  > reports/compose.log 2>&1 || true
                
                docker compose --env-file /dev/null ps -a \
                  > reports/containers.txt 2>&1 || true
            
            - name: Upload diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with: 
                name: integration-results-${{github.run_id}}-${{github.run_attempt}}
                path: reports/
                if-no-files-found: warn
                retention-days: 7
            
            - name: Clean up test environment
              if: always()
              run: |
                docker rm -f "$TEST_CONTAINER" || true
                docker compose --env-file /dev/null down \
                    -- volumes \
                    --remove-orphans
