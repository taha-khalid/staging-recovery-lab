name: CI

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

jobs:
    integration:
        name: Integration tests
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        defaults:
            run: 
                shell: bash
        
        env:
            COMPOSE_FILE: compose.yaml
            COMPOSE_PROFILES: test
            COMPOSE_PROJECT_NAME: ci-${{github.run_id}}-${{github.run_attempt}}
            TEST_CONTAINER: tests-${{github.run_id}}-${{github.run_attempt}}

            POSTGRES_USER: ${{secrets.CI_POSTGRES_USER}}
            POSTGRES_PASSWORD: ${{secrets.CI_POSTGRES_PASSWORD}}
            POSTGRES_DB: ${{secrets.CI_POSTGRES_DB}}
            API_PORT: "8001"
        
        steps:
            - name: Checkout source
              uses: actions/checkout@v5
              with:
                persist-credentials: false
            
            - name: Prepare report directory
              run: mkdir -p reports

            - name: Validate Compose configuration
              run: |
                docker compose version
                docker compose --env-file /dev/null config --quiet
            
            - name: Build API and test images
              run: |
                docker compose --env-file /dev/null build api tests
            
            - name: Start API and database
              run: |
                docker compose --env-file /dev/null up \
                  -d \
                  --no-build \
                  --wait \
                  --wait-timeout 90 \
                  api db
            
            - name: Run integration tests
              run: |
                docker compose --env-file /dev/null run \
                  -T \
                  --no-deps \
                  --name "$TEST_CONTAINER" \
                  tests \
                  python -m pytest tests/ \
                    -v \
                    -p no:cacheprovider \
                    --junitxml=/tmp/results.xml

            - name: Verify backup and restoration
              run: |
                docker compose --env-file /dev/null stop api

                python3 scripts/verify_recovery.py \
                    --env-file /dev/null \
                    --project "$COMPOSE_PROJECT_NAME"
                
                docker compose --env-file /dev/null start api

                python3 - <<'PY'
                import http.client
                import os 
                import time 
                import urllib.error
                import urllib.request

                url = f"http://127.0.0.1:{os.environ['API_PORT']}/ready"
                deadline = time.monotonic() + 30
                last_error = "No response received"

                while time.monotonic() < deadline:
                    try:
                        with urllib.request.urlopen(url, timeout=2) as response:
                            if response.status == 200:
                                print("API is ready after restart")
                                break
                            
                            last_error = f"HTTP {response.status}"

                    except (
                      urllib.error.URLError, 
                      OSError, 
                      http.client.HTTPException
                      ) as exc:
                        last_error = f"{type(exc).__name__}: {exc}"
                    
                    time.sleep(1)
                
                else:
                    raise SystemExit(
                        f"API did not become ready: {last_error}"
                    )
                
                PY
            
            - name: Verify database outage behavior
              run: |
                docker compose --env-file /dev/null stop db

                python3 - <<'PY'
                import os
                import time
                import urllib.error
                import urllib.request

                base_url = f"http://127.0.0.1:{os.environ['API_PORT']}"

                def get_status(path, timeout):
                    try:
                        with urllib.request.urlopen(
                            base_url + path,
                            timeout=timeout,
                            ) as response:
                                return response.status
                    except urllib.error.HTTPError as exc:
                        return exc.code
                
                health_status =  get_status("/health", timeout=3)
                assert health_status == 200, (
                    f"/health returned {health_status}; expected 200"
                )
                
                started = time.monotonic()
                ready_status = get_status("/ready", timeout=7)
                elapsed = time.monotonic() - started

                assert ready_status == 503, (
                    f"/ready returned {ready_status}; expected 503"
                )
                assert elapsed < 7, (
                    f"/ready took {elapsed:.2f}s; expected under 7s"
                )
                
                print(
                    f"Outage check passed: health=200"
                    f"ready=503, response time={elapsed:.2f}s"
                )
                PY
            
            - name: Export tested images
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                mkdir -p image-artifacts

                docker image save \
                --output image-artifacts/tested-images.tar \
                staging-recovery-api:latest \
                staging-recovery-tests:local
            
            - name: Upload tested images
              if: github.event_name == 'push' && github.ref =='refs/heads/main'
              uses: actions/upload-artifact@v4
              with:
                name: tested-images
                path: image-artifacts/tested-images.tar
                compression-level: 0
                retention-days: 1
                if-no-files-found: error
            
            - name: Collect test report and container logs
              if: always()
              run: |
                mkdir -p reports

                if docker container inspect "$TEST_CONTAINER" > /dev/null 2>&1; then
                  docker cp \
                    "$TEST_CONTAINER:/tmp/results.xml" \
                    reports/results.xml || true
                fi

                docker compose --env-file /dev/null logs \
                  --no-color --timestamps \
                  > reports/compose.log 2>&1 || true
                
                docker compose --env-file /dev/null ps -a \
                  > reports/containers.txt 2>&1 || true
            
            - name: Upload diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with: 
                name: integration-results-${{github.run_id}}-${{github.run_attempt}}
                path: reports/
                if-no-files-found: warn
                retention-days: 7
            
            - name: Clean up test environment
              if: always()
              run: |
                docker rm -f "$TEST_CONTAINER" || true
                docker compose --env-file /dev/null down \
                    --volumes \
                    --remove-orphans
    
    publish:
        name: Publish tested images
        needs: Integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        runs-on: ubuntu-24.04
        timeout-minutes: 10

        permissions:
            contents: read
            packages: write
        
        defaults:
            run:
                shell: bash
        
        steps:
            - name: Download tested images
              uses: actions/download-artifact@v4
              with:
                name: tested-images
                path: image-artifacts
            
            - name: Load tested images
              run: |
                docker image load \
                  --input image-artifacts/tested-images.tar
            
            - name: Authenticate to GHCR
              env:
                GHCR_TOKEN: ${{secrets.GITHUB_TOKEN}}
              
              run: |
                printf '%s' "$GHCR_TOKEN" |
                    docker login ghcr.io \
                      --username "$GITHUB_ACTOR" \
                      --password-stdin
            
            - name: Tag and publish images
              run: |
                namespace="${GITHUB_REPOSITORY_OWNERc,,}"
                tag="sha-${GITHUB_SHA}"

                api_image="ghcr.io/${namespace}/staging-recovery-api"
                tests_image="ghcr.io/${namespace}/staging-recovery-tests"

                docker tag staging-recovery-api:latest "${api_image}:${tag}"
                docker tag staging-recovery-tests:local "${tests_image}:${tag}"

                docker push "${api_image}:${tag}"
                docker push "${tests_image}:${tag}"

                {
                    echo "### Published images"
                    echo
                    echo "- API: \`${api_image}:${tag}\`"
                    echo "- Tests: \`${tests_image}:${tag}\`"
                } >> "$GITHUB_STEP_SUMMARY"

            - name: Log out of GHCR
              if: always()
              run: docker logout ghcr.io